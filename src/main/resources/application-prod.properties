# ===== CONFIGURAÇÕES DA APLICAÇÃO =====
# Nome da aplicação Spring Boot
spring.application.name=api

# ===== CONFIGURAÇÕES DO BANCO DE DADOS =====
# URL de conexão com MySQL (allowPublicKeyRetrieval=true resolve erro de autenticação)
spring.datasource.url=${DATASOURCE_URL}

# Usuário do banco de dados
spring.datasource.username=${DATASOURCE_USERNAME}
# Senha do banco de dados
spring.datasource.password=${DATASOURCE_PASSWORD}
# Driver JDBC do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== CONFIGURAÇÕES JPA/HIBERNATE =====
# Controla criação/atualização de tabelas (none=não faz nada, validate=apenas valida)
spring.jpa.hibernate.ddl-auto=none
# Habilita a exibição das queries SQL no console do Spring Boot
spring.jpa.show-sql=false
# Formata as queries SQL para melhor legibilidade
spring.jpa.properties.hibernate.format_sql=false
# Mostra os valores dos parâmetros das queries
spring.jpa.show-sql-parameters=true

# ===== CONFIGURAÇÕES DO FLYWAY =====
# Permite baseline em bancos que já existem
spring.flyway.baseline-on-migrate=true
# Desabilita validação de migrations (útil em desenvolvimento)
spring.flyway.validate-on-migrate=false

# ===== CONFIGURAÇÕES DO SERVIDOR =====
# Porta onde o servidor vai rodar (padrão: 8080)
server.port=8080

# Sempre inclui a mensagem de erro na resposta
server.error.include-message=always
# Inclui erros de validação (Bean Validation) na resposta
server.error.include-binding-errors=always
# Timeout para requisições HTTP (em milissegundos)
server.connection-timeout=20000
# Número máximo de threads para processar requisições
server.tomcat.threads.max=200
# Número mínimo de threads sempre ativas
server.tomcat.threads.min-spare=10
# Tamanho máximo do cabeçalho HTTP
server.max-http-header-size=8KB
# Tamanho máximo do corpo da requisição
server.tomcat.max-http-post-size=2MB

# ===== CONFIGURAÇÕES DE LOGGING =====
# Nível de log para a aplicação (DEBUG, INFO, WARN, ERROR)
logging.level.med.voll.api=INFO
# Nível de log para queries SQL (útil para debug)
logging.level.org.hibernate.SQL=DEBUG
# Nível de log para parâmetros das queries
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# ===== CONFIGURAÇÕES DE SEGURANÇA (JWT) =====
# Chave secreta para assinar tokens JWT (deve ser definida como variável de ambiente em produção)
api.security.token.secret=${JWT_SECRET:12345678}

# Significa: se não encontrar a variável de ambiente JWT_SECRET, usa o valor padrão 12345678
# No deploy em produção, defina a variável de ambiente JWT_SECRET com uma chave segura
