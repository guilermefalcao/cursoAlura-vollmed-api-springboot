# Arquivo de mensagens personalizadas para validação Bean Validation
# Este arquivo deve estar em src/main/resources e ter o nome exato ValidationMessages.properties
# O Spring Boot automaticamente reconhece este arquivo para internacionalização das mensagens de validação

# Mensagens para campos obrigatórios
nome.obrigatorio=Nome é obrigatório
email.obrigatorio=Email é obrigatório
telefone.obrigatorio=Telefone é obrigatório
crm.obrigatorio=CRM é obrigatório
especialidade.obrigatoria=Especialidade é obrigatória
endereco.obrigatorio=Dados do endereço são obrigatórios

# Mensagens para formatos inválidos
email.invalido=Formato do email é inválido
crm.invalido=Formato do CRM é inválido (deve conter entre 4 e 6 dígitos)

# Mensagens para endereço
logradouro.obrigatorio=Logradouro é obrigatório
bairro.obrigatorio=Bairro é obrigatório
cep.obrigatorio=CEP é obrigatório
cep.invalido=CEP deve conter exatamente 8 dígitos
cidade.obrigatoria=Cidade é obrigatória
uf.obrigatorio=UF é obrigatório

# Mensagens para paciente
cpf.obrigatorio=CPF é obrigatório
cpf.invalido=Formato do CPF é inválido